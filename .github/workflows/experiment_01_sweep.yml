name: Experiment 1 — 11-feature sweep + scoring

# Runs Publications/experiment_01/extract_features.py (2 models x 30 cases x 11
# features) on a GitHub runner, scores the output against the human gold standard
# with score.py, and commits the results back to the branch.
#
# extract_features.py checkpoints after every (case, model) call and resumes from
# the committed features.csv, so an interrupted or rate-limited run is safe to
# re-dispatch — it picks up exactly where it left off. A single dispatch (~2h)
# normally finishes all 30 PDFs x 2 models.
#
# Requires the NVIDIA_API_KEY repository secret.

on:
  workflow_dispatch:
  schedule:
    # 04:00 America/Los_Angeles. GitHub cron is fixed UTC with no DST, so this is
    # pinned to PDT (summer): 11:00 UTC = 04:00 PDT. During PST (winter) it lands
    # at 03:00 local. The sweep is idempotent — it resumes from the committed
    # features.csv and is a no-op once every (case, model) has succeeded — so a
    # daily fire safely completes an interrupted sweep and then does nothing.
    # NOTE: scheduled runs only fire from the DEFAULT branch (main); this cron
    # does nothing until this workflow is merged to main.
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: experiment-01-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install \
            pandas==2.3.3 \
            pymupdf==1.27.2 \
            openai==2.28.0 \
            requests==2.32.5 \
            pydantic==2.12.5

      # Sets steps.check.outputs.complete = true|false without calling any model.
      # A scheduled run whose sweep is already complete skips everything below,
      # so it never re-runs populated cells or overwrites committed results.
      # Manual (workflow_dispatch) runs always proceed — use one to force a
      # re-score after the human gold standard lands.
      - name: Check whether the sweep is already complete
        id: check
        run: python -u Publications/experiment_01/extract_features.py --check-complete

      - name: Run 11-feature sweep
        if: github.event_name != 'schedule' || steps.check.outputs.complete != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -u Publications/experiment_01/extract_features.py

      - name: Score against human gold standard
        if: always() && (github.event_name != 'schedule' || steps.check.outputs.complete != 'true')
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_SHA: ${{ github.sha }}
        run: python -u Publications/experiment_01/score.py --github-summary

      - name: Commit results
        if: always() && (github.event_name != 'schedule' || steps.check.outputs.complete != 'true')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Publications/experiment_01/results/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Experiment 1 sweep + scoring [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
