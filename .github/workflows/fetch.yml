name: Fetch Opinions

on:
  schedule:
    - cron: "0 15 * * *"  # daily at 15:00 UTC
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install \
            supabase==2.28.2 \
            requests==2.32.5 \
            beautifulsoup4==4.14.3 \
            feedparser==6.0.12

      - name: Run fetch
        id: fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FETCH_SUMMARY_FILE: fetch_summary.txt
        run: python -m pipeline.fetch

      - name: Send email notification
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os
          from pipeline.email_send import send_email

          status = os.environ["JOB_STATUS"]
          run_url = os.environ["RUN_URL"]
          icon = "✅" if status == "success" else "❌"

          # Read summary written by fetch.py (inserted count + RSS line)
          summary = ""
          try:
              with open("fetch_summary.txt") as f:
                  summary = f.read().strip()
          except FileNotFoundError:
              summary = "No summary available (fetch may have failed before writing output)."

          send_email(
              subject=f"{icon} Ninth Circuit fetch — {status}",
              html=(
                  f"<h3>{icon} Daily fetch {status}</h3>"
                  f"<pre style='background:#f5f5f5;padding:12px;border-radius:4px;'>{summary}</pre>"
                  f"<p><a href='{run_url}'>View full run logs</a></p>"
              ),
              text=f"Daily fetch {status}\n\n{summary}\n\n{run_url}",
          )
          EOF
