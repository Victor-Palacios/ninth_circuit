  <g stroke="#37d6ef" fill="#0c2742" stroke-width="1.8">
    <rect x="520" y="150" width="640" height="500" rx="2"/>
  </g>
  <g stroke="#37d6ef" stroke-width="1.4">
    <path d="M520 170 V150 H540"/><path d="M1140 150 H1160 V170"/>
    <path d="M520 630 V650 H540"/><path d="M1140 650 H1160 V630"/>
  </g>
  <text x="544" y="192" font-size="20" fill="#d7f7ff" filter="url(#glow)">rag-api</text>
  <text x="544" y="214" font-size="12" fill="#5d89ac">FASTAPI · RENDER FREE · 512MB</text>

  <!-- endpoints -->
  <g font-size="13">
    <rect x="544" y="232" width="180" height="44" fill="none" stroke="#37d6ef" stroke-width="1.2"/>
    <text x="558" y="252" fill="#9fe9f7">POST /chat</text>
    <text x="558" y="269" fill="#5d89ac" font-size="11">answer+citations</text>
    <rect x="742" y="232" width="180" height="44" fill="none" stroke="#37d6ef" stroke-width="1.2"/>
    <text x="756" y="252" fill="#9fe9f7">POST /search</text>
    <text x="756" y="269" fill="#5d89ac" font-size="11">top-k · no LLM</text>
    <rect x="940" y="232" width="196" height="44" fill="none" stroke="#37d6ef" stroke-width="1.2"/>
    <text x="954" y="252" fill="#9fe9f7">GET /health</text>
    <text x="954" y="269" fill="#5d89ac" font-size="11">stats</text>
  </g>

  <!-- pipeline rail -->
  <text x="544" y="318" font-size="13" fill="#7fb8d6" letter-spacing="2">RETRIEVAL PIPELINE ──────────────────</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="544" y="336" width="128" height="56" fill="#0a2036" stroke="#37d6ef" stroke-width="1.3"/>
    <text x="608" y="362" fill="#9fe9f7">FAISS</text>
    <text x="608" y="380" fill="#5d89ac" font-size="10.5">dense top-N</text>
    <rect x="700" y="336" width="128" height="56" fill="#0a2036" stroke="#37d6ef" stroke-width="1.3"/>
    <text x="764" y="362" fill="#9fe9f7">RERANK</text>
    <text x="764" y="380" fill="#5d89ac" font-size="10.5">cross-enc</text>
    <rect x="856" y="336" width="128" height="56" fill="#0a2036" stroke="#37d6ef" stroke-width="1.3"/>
    <text x="920" y="362" fill="#9fe9f7">BM25</text>
    <text x="920" y="380" fill="#5d89ac" font-size="10.5">hybrid .6/.4</text>
    <rect x="1012" y="336" width="124" height="56" fill="#0a2036" stroke="#37d6ef" stroke-width="1.3"/>
    <text x="1074" y="362" fill="#9fe9f7">DEDUPE</text>
