    <line x1="828" y1="364" x2="854" y2="364"/>
    <line x1="984" y1="364" x2="1010" y2="364"/>
  </g>

  <!-- gen + guard -->
  <rect x="544" y="424" width="280" height="74" fill="none" stroke="#2f6f4f" stroke-width="1.4"/>
  <text x="560" y="448" font-size="14" fill="#7ee0a8">GENERATION</text>
  <text x="560" y="470" font-size="11.5" fill="#5d89ac">llama-3.3-70b</text>
  <text x="560" y="488" font-size="11.5" fill="#5d89ac">[N] citation tags</text>
  <rect x="856" y="424" width="280" height="74" fill="none" stroke="#9a6b2f" stroke-width="1.4"/>
  <text x="872" y="448" font-size="14" fill="#f0c071">GUARDRAILS</text>
  <text x="872" y="470" font-size="11.5" fill="#5d89ac">refuse if cos &lt; 0.15</text>
  <text x="872" y="488" font-size="11.5" fill="#5d89ac">500-tok cap</text>

  <!-- in-mem note -->
  <rect x="544" y="522" width="592" height="104" fill="none" stroke="#1c3a5e" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="560" y="548" font-size="13" fill="#7fb8d6">LOAD @ STARTUP (lifespan):</text>
  <text x="560" y="574" font-size="12.5" fill="#9fd6ea">  INDEX = faiss.read_index("data/index.faiss")</text>
  <text x="560" y="596" font-size="12.5" fill="#9fd6ea">  META  = pd.read_parquet("data/metadata.parquet")</text>
  <text x="560" y="618" font-size="12" fill="#5d89ac">  ~170 MB resident · BM25 pre-warmed</text>

  <!-- ===== RIGHT MODULES ===== -->
  <!-- FAISS store -->
  <g stroke="#37d6ef" fill="#0c2742" stroke-width="1.6"><rect x="1230" y="150" width="320" height="130" rx="2"/></g>
  <text x="1250" y="186" font-size="17" fill="#d7f7ff">▤ FAISS + PARQUET</text>
  <text x="1250" y="212" font-size="12.5" fill="#9fd6ea">IndexIVFPQ · 2048-dim</text>
  <text x="1250" y="236" font-size="12.5" fill="#9fd6ea">GIT LFS artifact (~3MB)</text>
  <text x="1250" y="262" font-size="12" fill="#5d89ac">versioned w/ the code</text>

  <!-- NVIDIA -->
  <g stroke="#7ee0a8" fill="#0c2a1e" stroke-width="1.6"><rect x="1230" y="320" width="320" height="170" rx="2"/></g>
  <text x="1250" y="356" font-size="17" fill="#b9f5d2" filter="url(#glow)">▶ NVIDIA NIM</text>
  <text x="1250" y="380" font-size="11.5" fill="#5d89ac">FREE · OPENAI-COMPAT</text>
  <text x="1250" y="412" font-size="12.5" fill="#9fe9c9">embed  nemotron-embed-1b</text>
  <text x="1250" y="440" font-size="12.5" fill="#9fe9c9">rerank nemotron-rerank-1b</text>
  <text x="1250" y="468" font-size="12.5" fill="#9fe9c9">gen    llama-3.3-70b</text>

  <!-- Supabase -->
  <g stroke="#37d6ef" fill="#0c2742" stroke-width="1.6"><rect x="1230" y="530" width="320" height="120" rx="2"/></g>
  <text x="1250" y="566" font-size="17" fill="#d7f7ff">▣ SUPABASE PG</text>
  <text x="1250" y="592" font-size="12.5" fill="#9fd6ea">existing · metadata only</text>
  <text x="1250" y="618" font-size="12" fill="#5d89ac">citation link fields</text>

  <!-- ===== TRACES ===== -->
  <g fill="none" stroke="#37d6ef" stroke-width="1.8">
    <!-- browser -> frontend -->
    <path d="M210 270 V360" marker-end="url(#bpArrow)"/>
    <!-- frontend -> backend -->
    <path d="M360 460 H440 V300 H518" marker-end="url(#bpArrow)"/>
    <circle cx="440" cy="460" r="3" fill="#37d6ef"/>
    <!-- backend -> NVIDIA -->
    <path d="M1160 405 H1228" marker-end="url(#bpArrow)"/>
  </g>
  <g fill="none" stroke="#5d89ac" stroke-width="1.5" stroke-dasharray="5 4">
    <path d="M1160 215 H1228" marker-end="url(#bpArrow)"/>
    <path d="M1160 585 H1228" marker-end="url(#bpArrow)"/>
  </g>
  <text x="372" y="320" font-size="11" fill="#5d89ac" letter-spacing="1">HTTPS</text>

  <!-- pipeline footer band -->
  <line x1="44" y1="700" x2="1556" y2="700" stroke="#1c3a5e" stroke-width="1"/>
  <text x="44" y="734" font-size="14" fill="#7fb8d6" letter-spacing="2">OFFLINE ── ingest ▷ evaluate ▷ ci/cd ▷ deploy</text>
  <g font-size="12.5" fill="#9fd6ea">
    <text x="44"  y="772">[1] rag_ingest.py → IndexIVFPQ + Parquet (MLflow, seed 42)</text>
    <text x="44"  y="800">[2] run_eval.py  → groundedness · citation · latency p50/p95</text>
    <text x="44"  y="828">[3] gh-actions   → test (pytest+ruff) · deploy hook · scheduled eval</text>
    <text x="44"  y="856">[4] git push     → LFS upload → Render + Vercel auto-rebuild</text>
  </g>
  <text x="44" y="920" font-size="12" fill="#3f5f7c" letter-spacing="2">3 SERVICES · ZERO COST · FAISS-IN-GIT-LFS · github.com/Victor-Palacios/ninth_circuit</text>
</svg>
