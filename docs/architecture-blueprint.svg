<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Andale Mono, Courier New, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#1c3a5e" stroke-width="0.8"/>
    </pattern>
    <pattern id="gridBig" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0 H0 V200" fill="none" stroke="#23496f" stroke-width="1.4"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1c33"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <marker id="bpArrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#37d6ef" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgv)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#gridBig)"/>
  <rect x="14" y="14" width="1572" height="972" fill="none" stroke="#37d6ef" stroke-width="1.5" opacity="0.55"/>
  <rect x="22" y="22" width="1556" height="956" fill="none" stroke="#1c3a5e" stroke-width="1"/>

  <!-- titleblock -->
  <text x="44" y="64" font-size="30" fill="#9fe9f7" letter-spacing="2" filter="url(#glow)">NINTH CIRCUIT ASYLUM // RAG SYSTEM</text>
  <text x="46" y="90" font-size="14" fill="#5d89ac" letter-spacing="3">SCHEMATIC REV. afbbf25  ·  FREE-TIER STACK  ·  SHEET 1/1</text>
  <line x1="44" y1="104" x2="900" y2="104" stroke="#37d6ef" stroke-width="1" opacity="0.5"/>

  <!-- corner-tick helper look: define a reusable group via use is hard; inline ticks per box -->

  <!-- ===== BROWSER ===== -->
  <g stroke="#37d6ef" fill="none" stroke-width="1.6">
    <rect x="60" y="150" width="300" height="120" rx="2"/>
  </g>
  <g stroke="#37d6ef" stroke-width="1.4">
    <path d="M60 168 V150 H78"/><path d="M342 150 H360 V168"/>
    <path d="M60 252 V270 H78"/><path d="M342 270 H360 V252"/>
  </g>
  <text x="80" y="196" font-size="20" fill="#d7f7ff">[ CLIENT ]</text>
  <text x="80" y="222" font-size="14" fill="#7fb8d6">browser · attorney</text>
  <text x="80" y="246" font-size="13" fill="#5d89ac">opens /cases panel</text>

  <!-- ===== FRONTEND ===== -->
  <g stroke="#37d6ef" fill="#0c2742" stroke-width="1.6">
    <rect x="60" y="360" width="300" height="200" rx="2"/>
  </g>
  <g stroke="#37d6ef" stroke-width="1.4">
    <path d="M60 378 V360 H78"/><path d="M342 360 H360 V378"/>
    <path d="M60 542 V560 H78"/><path d="M342 560 H360 V542"/>
  </g>
  <text x="80" y="404" font-size="19" fill="#d7f7ff" filter="url(#glow)">asylum-viewer</text>
  <text x="80" y="426" font-size="12" fill="#5d89ac">NEXT.JS · VERCEL</text>
  <line x1="80" y1="440" x2="340" y2="440" stroke="#1c3a5e"/>
  <text x="80" y="470" font-size="13" fill="#9fd6ea">+ /cases + Case Assistant</text>
  <text x="80" y="496" font-size="13" fill="#9fd6ea">+ Ask / Search / citations</text>
  <text x="80" y="528" font-size="13" fill="#9fd6ea">+ /api/rag/* proxy (server)</text>

