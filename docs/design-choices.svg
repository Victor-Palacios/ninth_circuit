<svg width="1600" height="1040" viewBox="0 0 1600 1040" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="dc" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1b2a3a" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bgd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1040" fill="url(#bgd)"/>

  <text x="60" y="74" font-size="40" font-weight="bold" fill="#1f2d3d">Design choices — and why</text>
  <text x="62" y="108" font-size="19" fill="#6a7a8a">Five decisions that shape retrieval quality, cost, and how it scales</text>
  <rect x="62" y="122" width="430" height="5" rx="2.5" fill="#30a2da"/>

  <!-- ===== CARD 1: EMBEDDING MODEL ===== -->
  <g filter="url(#dc)"><rect x="60" y="170" width="470" height="380" rx="16" fill="#ffffff"/></g>
  <rect x="60" y="170" width="470" height="9" rx="4.5" fill="#30a2da"/>
  <text x="88" y="222" font-size="22" font-weight="bold" fill="#1f2d3d">🧠  Embedding model</text>
  <rect x="88" y="240" width="414" height="40" rx="8" fill="#eef6fc"/>
  <text x="104" y="266" font-size="14.5" font-weight="bold" fill="#1f6f99">llama-nemotron-embed-1b-v2 · 2048-d</text>
  <g font-size="14.5" fill="#3a4452">
    <circle cx="98" cy="312" r="3.5" fill="#30a2da"/><text x="112" y="317">Free NIM tier: embed + rerank + gen, one key</text>
    <circle cx="98" cy="344" r="3.5" fill="#30a2da"/><text x="112" y="349">Retrieval-tuned, 2048-token context</text>
    <circle cx="98" cy="376" r="3.5" fill="#30a2da"/><text x="112" y="381">Asymmetric: <tspan font-weight="bold">passage</tspan> for ingest,</text>
    <text x="112" y="400"><tspan font-weight="bold">query</tspan> for search → higher recall on questions</text>
  </g>
  <rect x="88" y="470" width="414" height="56" rx="8" fill="#f5f8fb"/>
  <text x="104" y="492" font-size="12.5" font-weight="bold" fill="#8a98a6">WHY THIS ONE</text>
  <text x="104" y="513" font-size="13.5" fill="#5a6470">QA-tuned + free + drops into existing code patterns.</text>

  <!-- ===== CARD 2: CHUNKING ===== -->
  <g filter="url(#dc)"><rect x="565" y="170" width="470" height="380" rx="16" fill="#ffffff"/></g>
  <rect x="565" y="170" width="470" height="9" rx="4.5" fill="#2b8cc4"/>
  <text x="593" y="222" font-size="22" font-weight="bold" fill="#1f2d3d">✂️  Chunking</text>
  <rect x="593" y="240" width="414" height="40" rx="8" fill="#eef6fc"/>
  <text x="609" y="266" font-size="14.5" font-weight="bold" fill="#1f6f99">~1500 tokens · 150 overlap · page-aware</text>
  <g font-size="14.5" fill="#3a4452">
    <circle cx="603" cy="312" r="3.5" fill="#2b8cc4"/><text x="617" y="317">Under the 2048 cap, keeps real legal context</text>
    <circle cx="603" cy="344" r="3.5" fill="#2b8cc4"/><text x="617" y="349">~6 chunks/case → precision + less storage</text>
    <circle cx="603" cy="376" r="3.5" fill="#2b8cc4"/><text x="617" y="381">Overlap stops a holding splitting across a</text>
    <text x="617" y="400">boundary and being lost</text>
  </g>
  <rect x="593" y="470" width="414" height="56" rx="8" fill="#f5f8fb"/>
  <text x="609" y="492" font-size="12.5" font-weight="bold" fill="#8a98a6">WHY THIS ONE</text>
  <text x="609" y="513" font-size="13.5" fill="#5a6470">Page boundaries → "page N of case X" citations.</text>

  <!-- ===== CARD 3: k ===== -->
  <g filter="url(#dc)"><rect x="1070" y="170" width="470" height="380" rx="16" fill="#ffffff"/></g>
  <rect x="1070" y="170" width="470" height="9" rx="4.5" fill="#1f6f99"/>
  <text x="1098" y="222" font-size="22" font-weight="bold" fill="#1f2d3d">🎯  Retrieval depth (k)</text>
  <rect x="1098" y="240" width="414" height="40" rx="8" fill="#eef6fc"/>
  <text x="1114" y="266" font-size="14.5" font-weight="bold" fill="#1f6f99">fetch ~20  →  return 5</text>
  <g font-size="14.5" fill="#3a4452">
    <circle cx="1108" cy="312" r="3.5" fill="#1f6f99"/><text x="1122" y="317">Wide pool feeds the reranker + dedupe</text>
    <circle cx="1108" cy="344" r="3.5" fill="#1f6f99"/><text x="1122" y="349">Top-5 = a scannable list for a lawyer</text>
    <circle cx="1108" cy="376" r="3.5" fill="#1f6f99"/><text x="1122" y="381">Small context → better groundedness</text>
    <text x="1122" y="400">and lower latency</text>
  </g>
  <rect x="1098" y="470" width="414" height="56" rx="8" fill="#f5f8fb"/>
  <text x="1114" y="492" font-size="12.5" font-weight="bold" fill="#8a98a6">WHY THIS ONE</text>
  <text x="1114" y="513" font-size="13.5" fill="#5a6470">Exposed as a constant — ablatable k ∈ {3, 5, 10}.</text>

  <!-- ===== CARD 4: PROMPT FORMAT ===== -->
  <g filter="url(#dc)"><rect x="60" y="580" width="470" height="380" rx="16" fill="#ffffff"/></g>
  <rect x="60" y="580" width="470" height="9" rx="4.5" fill="#2e8b57"/>
  <text x="88" y="632" font-size="22" font-weight="bold" fill="#1f2d3d">📝  Prompt format</text>
  <rect x="88" y="650" width="414" height="40" rx="8" fill="#edf7f0"/>
  <text x="104" y="676" font-size="14.5" font-weight="bold" fill="#1f7a4d">numbered passages → [N] citation tags</text>
  <g font-size="14.5" fill="#3a4452">
    <circle cx="98" cy="722" r="3.5" fill="#2e8b57"/><text x="112" y="727">Feeds context as [1] … [2] … blocks</text>
    <circle cx="98" cy="754" r="3.5" fill="#2e8b57"/><text x="112" y="759">[N] tags parse back to chunk IDs →</text>
    <text x="112" y="778">snippet + page + case-link cards</text>
    <circle cx="98" cy="804" r="3.5" fill="#2e8b57"/><text x="112" y="809">Grounded, ≤500 tokens, refuse-if-unrelated</text>
  </g>
  <rect x="88" y="880" width="414" height="56" rx="8" fill="#f5f8fb"/>
  <text x="104" y="902" font-size="12.5" font-weight="bold" fill="#8a98a6">WHY THIS ONE</text>
  <text x="104" y="923" font-size="13.5" fill="#5a6470">Machine-parseable citations, tied to the corpus.</text>

  <!-- ===== CARD 5: VECTOR STORE ===== -->
  <g filter="url(#dc)"><rect x="565" y="580" width="470" height="380" rx="16" fill="#ffffff"/></g>
  <rect x="565" y="580" width="470" height="9" rx="4.5" fill="#a50026"/>
  <text x="593" y="632" font-size="22" font-weight="bold" fill="#1f2d3d">🗂️  Vector store</text>
  <rect x="593" y="650" width="414" height="40" rx="8" fill="#fbeef0"/>
  <text x="609" y="676" font-size="14.5" font-weight="bold" fill="#a50026">FAISS IndexIVFPQ · in Git LFS</text>
  <g font-size="14.5" fill="#3a4452">
    <circle cx="603" cy="722" r="3.5" fill="#a50026"/><text x="617" y="727">No vector-DB vendor → stays 3 services</text>
    <circle cx="603" cy="754" r="3.5" fill="#a50026"/><text x="617" y="759">In-process µs search, versioned artifact</text>
    <circle cx="603" cy="786" r="3.5" fill="#a50026"/><text x="617" y="791">IVFPQ from day 1: MVP → full corpus,</text>
    <text x="617" y="810">no refactor (params auto-scale with N)</text>
  </g>
  <rect x="593" y="880" width="414" height="56" rx="8" fill="#fdf3f5"/>
  <text x="609" y="902" font-size="12.5" font-weight="bold" fill="#b06"  fill-opacity="0.7">WHY NOT</text>
  <text x="609" y="923" font-size="13.5" fill="#5a6470">pgvector caps at 500 MB · Pinecone = +vendor +cold start.</text>

  <!-- ===== CARD 6: THROUGHLINE ===== -->
  <g filter="url(#dc)"><rect x="1070" y="580" width="470" height="380" rx="16" fill="#1f2d3d"/></g>
  <text x="1098" y="632" font-size="22" font-weight="bold" fill="#ffffff">The throughline</text>
  <text x="1098" y="658" font-size="13.5" fill="#9fb3c6">every choice optimizes the same four things</text>
  <g font-size="15">
    <circle cx="1108" cy="704" r="4" fill="#30a2da"/><text x="1124" y="709" fill="#d6e2ec"><tspan font-weight="bold" fill="#fff">$0 / month</tspan> — free-tier only</text>
    <circle cx="1108" cy="744" r="4" fill="#30a2da"/><text x="1124" y="749" fill="#d6e2ec"><tspan font-weight="bold" fill="#fff">Reproducible</tspan> — index is a Git artifact</text>
    <circle cx="1108" cy="784" r="4" fill="#30a2da"/><text x="1124" y="789" fill="#d6e2ec"><tspan font-weight="bold" fill="#fff">Lawyer-first</tspan> — verifiable citations</text>
    <circle cx="1108" cy="824" r="4" fill="#30a2da"/><text x="1124" y="829" fill="#d6e2ec"><tspan font-weight="bold" fill="#fff">Scales</tspan> — 30 → 6,000 cases, no rewrite</text>
  </g>
  <line x1="1098" y1="858" x2="1512" y2="858" stroke="#33455a"/>
  <text x="1098" y="894" font-size="13" fill="#9fb3c6">Trade-off accepted: ~1–3% recall dip at</text>
  <text x="1098" y="914" font-size="13" fill="#9fb3c6">MVP scale to keep one permanent index type.</text>

  <text x="60" y="1010" font-size="14" fill="#8a98a6">Detail: design-and-evaluation.md · constants live in rag_api/retrieval.py and pipeline/rag_ingest.py</text>
</svg>
